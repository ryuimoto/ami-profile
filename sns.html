<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMI IMOTO - SNS & Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Yusei+Magic&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-wrapper">
        <div class="profile-card">
            <header class="profile-header" style="justify-content: center; margin-bottom: 40px;">
                <div class="profile-title" style="text-align: center;">
                    <p class="subtitle">follow me & contact</p>
                    <h1 class="name">SNS</h1>
                </div>
            </header>

            <div class="profile-content">
                <div class="column">
                    <section class="info-block">
                        <h2 class="section-title">Instagram</h2>
                        <div class="qr-container">
                            <img src="insta_qr_cropped.png" alt="Instagram QR Code" class="qr-image">
                        </div>
                        <p class="section-text" style="margin-top: 15px;">デザインや<br>日々の様子を更新中です✨</p>
                    </section>
                </div>

                <div class="column">
                    <section class="info-block">
                        <h2 class="section-title">LINE</h2>
                        <div class="qr-container">
                            <img src="line_qr_cropped.png" alt="LINE QR Code" class="qr-image">
                        </div>
                        <p class="section-text" style="margin-top: 15px;">ご予約・お問い合わせは<br>こちらから<br>お願いいたします🌸</p>
                    </section>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
